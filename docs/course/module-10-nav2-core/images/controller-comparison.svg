<svg viewBox="0 0 580 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .panel { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1.5; }
    .path { stroke: #4a5568; stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
    .robot { fill: #c53030; }
    .cand { stroke: #a0aec0; stroke-width: 1.2; fill: none; }
    .best { stroke: #1a7a4c; stroke-width: 2.2; fill: none; }
    .lookahead { fill: #b7791f; }
    .lbl { font-size: 12.5px; font-weight: 700; fill: #1a202c; text-anchor: middle; }
    .cap { font-size: 10px; fill: #718096; text-anchor: middle; }
  </style>

  <text x="290" y="18" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">3 cách "controller" tính ra lệnh vận tốc kế tiếp</text>

  <rect class="panel" x="10" y="30" width="185" height="210"/>
  <text class="lbl" x="102" y="50">DWB</text>
  <path class="path" d="M 30 210 Q 100 120, 170 60"/>
  <circle class="robot" cx="60" cy="180" r="6"/>
  <path class="cand" d="M 60 180 Q 90 160, 120 130"/>
  <path class="cand" d="M 60 180 Q 85 150, 100 110"/>
  <path class="best" d="M 60 180 Q 95 145, 130 100"/>
  <path class="cand" d="M 60 180 Q 70 140, 75 100"/>
  <text class="cap" x="102" y="225">thử nhiều (v, ω) HỢP LỆ ngay bước kế</text>
  <text class="cap" x="102" y="237">tiếp, chọn cái tới gần path nhất</text>

  <rect class="panel" x="200" y="30" width="185" height="210"/>
  <text class="lbl" x="292" y="50">RPP (Pure Pursuit)</text>
  <path class="path" d="M 220 210 Q 290 120, 360 60"/>
  <circle class="robot" cx="250" cy="180" r="6"/>
  <circle class="lookahead" cx="310" cy="105" r="5"/>
  <line class="best" x1="250" y1="180" x2="310" y2="105"/>
  <text class="cap" x="292" y="225">chọn 1 điểm "nhìn trước" trên path,</text>
  <text class="cap" x="292" y="237">lái cung tròn hướng thẳng tới đó</text>

  <rect class="panel" x="390" y="30" width="185" height="210"/>
  <text class="lbl" x="482" y="50">MPPI</text>
  <path class="path" d="M 410 210 Q 480 120, 550 60"/>
  <circle class="robot" cx="440" cy="180" r="6"/>
  <path class="cand" d="M 440 180 Q 470 160, 500 130"/>
  <path class="cand" d="M 440 180 Q 460 150, 470 110"/>
  <path class="cand" d="M 440 180 Q 475 145, 510 100"/>
  <path class="cand" d="M 440 180 Q 450 140, 455 100"/>
  <path class="cand" d="M 440 180 Q 480 155, 520 115"/>
  <path class="best" d="M 440 180 Q 465 145, 500 105"/>
  <text class="cap" x="482" y="225">lấy mẫu HÀNG NGHÌN quỹ đạo tương lai</text>
  <text class="cap" x="482" y="237">(batch_size), chọn trung bình trọng số tốt nhất</text>
</svg>
