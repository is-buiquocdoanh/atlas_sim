<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .actor { fill: #eef4fb; stroke: #2b6cb0; stroke-width: 2; rx: 8; }
    .lifeline { stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .req { stroke: #2b6cb0; stroke-width: 2; marker-end: url(#a1); }
    .res { stroke: #1a7a4c; stroke-width: 2; marker-end: url(#a2); }
    .lbl { font-size: 12.5px; fill: #1a202c; }
    .title { font-size: 14px; font-weight: 700; fill: #1a202c; }
    .cap { font-size: 11px; fill: #718096; }
  </style>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#2b6cb0"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#1a7a4c"/></marker>
  </defs>

  <text x="280" y="24" text-anchor="middle" class="title">Service: request / response, đúng 1 lần</text>

  <rect class="actor" x="60" y="40" width="110" height="36"/>
  <text class="lbl" x="115" y="62" text-anchor="middle">Client</text>
  <line class="lifeline" x1="115" y1="76" x2="115" y2="220"/>

  <rect class="actor" x="390" y="40" width="110" height="36"/>
  <text class="lbl" x="445" y="62" text-anchor="middle">Server</text>
  <line class="lifeline" x1="445" y1="76" x2="445" y2="220"/>

  <line class="req" x1="115" y1="120" x2="443" y2="120"/>
  <text class="cap" x="280" y="112" text-anchor="middle">request (call_async)</text>

  <rect x="425" y="130" width="40" height="45" fill="#eafaf1" stroke="#1a7a4c" stroke-width="1.5"/>
  <text class="cap" x="445" y="155" text-anchor="middle" transform="rotate(0)">xử lý</text>

  <line class="res" x1="443" y1="185" x2="117" y2="185"/>
  <text class="cap" x="280" y="203" text-anchor="middle">response (client tự spin chờ Future)</text>
</svg>
