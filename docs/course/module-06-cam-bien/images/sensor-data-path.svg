<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .box { fill: #eef4fb; stroke: #2b6cb0; stroke-width: 2; rx: 8; }
    .gz { fill: #fffaf0; stroke: #dd6b20; stroke-width: 2; rx: 8; }
    .ros { fill: #e6fffa; stroke: #2f855a; stroke-width: 2; rx: 8; }
    .zone { fill: none; stroke: #a0aec0; stroke-width: 1.6; stroke-dasharray: 7 5; rx: 10; }
    .lbl { font-size: 12px; fill: #1a202c; font-weight: 600; }
    .sub { font-size: 10.5px; fill: #4a5568; }
    .cap { font-size: 11px; fill: #718096; }
    .zlbl { font-size: 11.5px; fill: #718096; font-weight: 600; }
    .arr { stroke: #718096; stroke-width: 1.8; marker-end: url(#a); fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#718096"/></marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">Dữ liệu cảm biến đi qua 4 chặng -- hỏng chặng nào cũng cho ra "không có /scan"</text>

  <rect class="zone" x="15" y="40" width="390" height="230"/>
  <text class="zlbl" x="30" y="60">Tiến trình gz-sim</text>

  <rect class="box" x="35" y="72" width="160" height="56"/>
  <text class="lbl" x="115" y="94" text-anchor="middle">1. &lt;sensor type="gpu_lidar"&gt;</text>
  <text class="sub" x="115" y="112" text-anchor="middle">khai trong atlas.gazebo.xacro</text>

  <line class="arr" x1="195" y1="100" x2="238" y2="100"/>
  <rect class="gz" x="240" y="72" width="150" height="56"/>
  <text class="lbl" x="315" y="94" text-anchor="middle">2. Sensors system</text>
  <text class="sub" x="315" y="112" text-anchor="middle">khai trong world .sdf</text>

  <rect class="gz" x="120" y="165" width="230" height="52"/>
  <text class="lbl" x="235" y="186" text-anchor="middle">3. Gazebo Transport: /scan</text>
  <text class="sub" x="235" y="203" text-anchor="middle">gz.msgs.LaserScan -- ros2 chưa thấy được</text>
  <line class="arr" x1="315" y1="128" x2="290" y2="163"/>

  <rect class="zone" x="425" y="40" width="260" height="230"/>
  <text class="zlbl" x="440" y="60">Thế giới ROS 2</text>

  <rect class="ros" x="445" y="72" width="220" height="56"/>
  <text class="lbl" x="555" y="94" text-anchor="middle">5. RViz / SLAM / Nav2</text>
  <text class="sub" x="555" y="112" text-anchor="middle">cần TF lidar_link mới vẽ đúng chỗ</text>

  <rect class="ros" x="445" y="165" width="220" height="52"/>
  <text class="lbl" x="555" y="186" text-anchor="middle">/scan (sensor_msgs/LaserScan)</text>
  <text class="sub" x="555" y="203" text-anchor="middle">header.frame_id = lidar_link</text>
  <line class="arr" x1="555" y1="165" x2="555" y2="130"/>

  <rect x="255" y="235" width="190" height="46" fill="#fff5f5" stroke="#c53030" stroke-width="2" rx="8"/>
  <text class="lbl" x="350" y="255" text-anchor="middle">4. ros_gz_bridge</text>
  <text class="sub" x="350" y="272" text-anchor="middle">gz_bridge.yaml</text>
  <line class="arr" x1="235" y1="217" x2="290" y2="233"/>
  <line class="arr" x1="420" y1="245" x2="500" y2="215"/>

  <rect class="box" x="35" y="300" width="290" height="40"/>
  <text class="lbl" x="180" y="318" text-anchor="middle">robot_state_publisher → TF base_link → lidar_link</text>
  <text class="sub" x="180" y="334" text-anchor="middle">nhánh độc lập, KHÔNG đi qua Gazebo</text>
  <line class="arr" x1="325" y1="318" x2="520" y2="222"/>

  <text class="cap" x="520" y="318" text-anchor="middle">gz_frame_id trong &lt;sensor&gt; phải</text>
  <text class="cap" x="520" y="334" text-anchor="middle">trùng tên link trong URDF.</text>
</svg>
