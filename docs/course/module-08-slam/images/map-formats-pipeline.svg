<svg viewBox="0 0 580 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .core { fill: #fef6e7; stroke: #b7791f; stroke-width: 2.5; rx: 10; }
    .box { fill: #eef4fb; stroke: #2b6cb0; stroke-width: 2; rx: 8; }
    .lbl { font-size: 13px; fill: #1a202c; font-weight: 600; }
    .cap { font-size: 10.5px; fill: #718096; }
    .arr { stroke: #718096; stroke-width: 1.8; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#718096"/>
    </marker>
  </defs>

  <rect class="core" x="220" y="20" width="140" height="50"/>
  <text class="lbl" x="290" y="50" text-anchor="middle">pose graph</text>
  <text class="cap" x="290" y="64" text-anchor="middle">(trong bộ nhớ slam_toolbox)</text>

  <line class="arr" x1="250" y1="70" x2="130" y2="130"/>
  <line class="arr" x1="330" y1="70" x2="450" y2="130"/>

  <rect class="box" x="30" y="132" width="210" height="50"/>
  <text class="lbl" x="135" y="152" text-anchor="middle">map_saver_cli</text>
  <text class="cap" x="135" y="168" text-anchor="middle">nav2_map_server</text>

  <rect class="box" x="340" y="132" width="210" height="50"/>
  <text class="lbl" x="445" y="152" text-anchor="middle">/slam_toolbox/serialize_map</text>
  <text class="cap" x="445" y="168" text-anchor="middle">service call</text>

  <line class="arr" x1="135" y1="182" x2="135" y2="210"/>
  <rect class="box" x="30" y="212" width="210" height="36" fill="#eafaf1" stroke="#1a7a4c"/>
  <text class="lbl" x="135" y="235" text-anchor="middle">.pgm + .yaml -- dùng cho AMCL</text>

  <line class="arr" x1="445" y1="182" x2="445" y2="210"/>
  <rect class="box" x="340" y="212" width="210" height="36" fill="#eafaf1" stroke="#1a7a4c"/>
  <text class="lbl" x="445" y="235" text-anchor="middle">.posegraph + .data -- slam_toolbox</text>
</svg>
