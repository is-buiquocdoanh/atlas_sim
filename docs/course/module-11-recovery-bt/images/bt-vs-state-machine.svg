<svg viewBox="0 0 580 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .state { fill: #eef4fb; stroke: #2b6cb0; stroke-width: 1.8; }
    .node { fill: #eafaf1; stroke: #1a7a4c; stroke-width: 1.6; rx: 6; }
    .lbl { font-size: 11px; fill: #1a202c; font-weight: 600; text-anchor: middle; }
    .cap { font-size: 10.5px; fill: #718096; text-anchor: middle; }
    .arr { stroke: #718096; stroke-width: 1.5; marker-end: url(#a); fill: none; }
    .title { font-size: 13px; font-weight: 700; fill: #1a202c; text-anchor: middle; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L4,2 L0,4 Z" fill="#718096"/>
    </marker>
  </defs>

  <text x="140" y="20" class="title">State machine: mỗi trạng thái "biết" chuyển đi đâu</text>
  <circle class="state" cx="60" cy="100" r="30"/>
  <text class="lbl" x="60" y="104">Đi tới</text>
  <circle class="state" cx="170" cy="60" r="30"/>
  <text class="lbl" x="170" y="64">Né vật</text>
  <circle class="state" cx="170" cy="150" r="30"/>
  <text class="lbl" x="170" y="154">Dừng</text>
  <path class="arr" d="M 85 85 Q 120 65, 145 65"/>
  <path class="arr" d="M 145 145 Q 115 125, 88 110"/>
  <path class="arr" d="M 170 90 Q 170 115, 170 120"/>
  <text class="cap" x="140" y="210">N trạng thái = tới N² đường chuyển có thể -- rối dần khi thêm hành vi mới</text>

  <text x="440" y="20" class="title">Behavior Tree: cây quyết định, tick từ gốc</text>
  <rect class="node" x="390" y="40" width="100" height="30"/>
  <text class="lbl" x="440" y="59">Fallback</text>
  <rect class="node" x="330" y="100" width="90" height="30"/>
  <text class="lbl" x="375" y="119">Đi tới</text>
  <rect class="node" x="440" y="100" width="90" height="30"/>
  <text class="lbl" x="485" y="119">Recovery</text>
  <path class="arr" d="M 420 70 L 380 98"/>
  <path class="arr" d="M 460 70 L 485 98"/>
  <text class="cap" x="440" y="210">Thêm hành vi mới = thêm 1 nhánh trong cây,</text>
  <text class="cap" x="440" y="224">không phải vẽ lại toàn bộ sơ đồ chuyển trạng thái</text>
</svg>
