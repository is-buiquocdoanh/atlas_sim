<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .box { fill: #eef4fb; stroke: #2b6cb0; stroke-width: 2; rx: 8; }
    .lbl { font-size: 13px; fill: #1a202c; font-weight: 600; }
    .sub { font-size: 11px; fill: #4a5568; }
    .cap { font-size: 11px; fill: #718096; }
    .shape { fill: none; stroke-width: 2; }
  </style>

  <text x="310" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">1 &lt;link&gt; = 3 lớp mô tả ĐỘC LẬP nhau cho cùng 1 khối vật thể</text>

  <rect class="box" x="20" y="45" width="180" height="180"/>
  <text class="lbl" x="110" y="68" text-anchor="middle">&lt;visual&gt;</text>
  <rect x="55" y="90" width="110" height="70" fill="#bee3f8" stroke="#2b6cb0" stroke-width="2" rx="4"/>
  <text class="sub" x="110" y="185" text-anchor="middle">Cái MẮT nhìn thấy</text>
  <text class="sub" x="110" y="202" text-anchor="middle">(RViz, Gazebo render)</text>

  <rect class="box" x="220" y="45" width="180" height="180"/>
  <text class="lbl" x="310" y="68" text-anchor="middle">&lt;collision&gt;</text>
  <rect class="shape" x="255" y="90" width="110" height="70" stroke="#dd6b20" stroke-dasharray="6 4"/>
  <text class="sub" x="310" y="185" text-anchor="middle">Cái VẬT LÝ chạm vào</text>
  <text class="sub" x="310" y="202" text-anchor="middle">(va chạm, ma sát -- M4)</text>

  <rect class="box" x="420" y="45" width="180" height="180"/>
  <text class="lbl" x="510" y="68" text-anchor="middle">&lt;inertial&gt;</text>
  <circle cx="510" cy="125" r="9" fill="#2f855a"/>
  <line x1="470" y1="125" x2="550" y2="125" stroke="#2f855a" stroke-width="2"/>
  <line x1="510" y1="95" x2="510" y2="155" stroke="#2f855a" stroke-width="2"/>
  <text class="sub" x="510" y="185" text-anchor="middle">Khối lượng + quán tính</text>
  <text class="sub" x="510" y="202" text-anchor="middle">(cách vật phản ứng lực)</text>

  <text class="cap" x="310" y="255" text-anchor="middle">3 lớp có thể KHÁC hình dạng nhau: visual dùng mesh đẹp, collision dùng hộp đơn giản cho nhanh.</text>
  <text class="cap" x="310" y="275" text-anchor="middle">RViz (Module 3) chỉ đọc visual -- thiếu inertial vẫn hiện hình, nhưng sẽ vỡ vật lý ở Gazebo (Module 4).</text>
</svg>
