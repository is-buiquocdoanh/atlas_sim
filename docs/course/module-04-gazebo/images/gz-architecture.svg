<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .box { fill: #eef4fb; stroke: #2b6cb0; stroke-width: 2; rx: 8; }
    .node { fill: #e6fffa; stroke: #2f855a; stroke-width: 2; rx: 8; }
    .topic { fill: #fffaf0; stroke: #dd6b20; stroke-width: 2; rx: 14; }
    .zone { fill: none; stroke: #a0aec0; stroke-width: 1.6; stroke-dasharray: 7 5; rx: 10; }
    .lbl { font-size: 12.5px; fill: #1a202c; font-weight: 600; }
    .sub { font-size: 10.5px; fill: #4a5568; }
    .cap { font-size: 11px; fill: #718096; }
    .zlbl { font-size: 11.5px; fill: #718096; font-weight: 600; }
    .arr { stroke: #718096; stroke-width: 1.8; marker-end: url(#a); fill: none; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#718096"/>
    </marker>
  </defs>

  <text x="350" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">Hai thế giới topic riêng biệt -- nối nhau bằng ros_gz_bridge</text>

  <rect class="zone" x="15" y="40" width="320" height="270"/>
  <text class="zlbl" x="30" y="60">Tiến trình gz-sim (Gazebo Fortress)</text>

  <rect class="box" x="35" y="72" width="130" height="46"/>
  <text class="lbl" x="100" y="91" text-anchor="middle">Physics system</text>
  <text class="sub" x="100" y="108" text-anchor="middle">giải va chạm, trọng lực</text>

  <rect class="box" x="180" y="72" width="135" height="46"/>
  <text class="lbl" x="247" y="91" text-anchor="middle">Sensors system</text>
  <text class="sub" x="247" y="108" text-anchor="middle">lidar, imu, camera</text>

  <rect class="box" x="35" y="132" width="280" height="44"/>
  <text class="lbl" x="175" y="151" text-anchor="middle">SceneBroadcaster / UserCommands / Contact</text>
  <text class="sub" x="175" y="168" text-anchor="middle">khai báo trong world .sdf, không phải mặc định</text>

  <rect class="topic" x="60" y="200" width="230" height="44"/>
  <text class="lbl" x="175" y="220" text-anchor="middle">Gazebo Transport</text>
  <text class="sub" x="175" y="236" text-anchor="middle">/clock, /scan, /imu -- KHÔNG phải topic ROS 2</text>
  <line class="arr" x1="100" y1="118" x2="120" y2="198"/>
  <line class="arr" x1="247" y1="118" x2="225" y2="198"/>

  <rect class="node" x="60" y="260" width="230" height="38"/>
  <text class="lbl" x="175" y="284" text-anchor="middle">gz_ros2_control (Module 5)</text>
  <line class="arr" x1="175" y1="176" x2="175" y2="198"/>

  <rect class="zone" x="380" y="40" width="305" height="270"/>
  <text class="zlbl" x="395" y="60">Thế giới ROS 2 (DDS)</text>

  <rect class="topic" x="400" y="72" width="265" height="104"/>
  <text class="lbl" x="532" y="94" text-anchor="middle">Topic ROS 2</text>
  <text class="sub" x="532" y="114" text-anchor="middle">/clock -- mọi node đặt use_sim_time=true</text>
  <text class="sub" x="532" y="132" text-anchor="middle">/scan, /imu (Module 6)</text>
  <text class="sub" x="532" y="150" text-anchor="middle">/cmd_vel, /odom, /joint_states (Module 5)</text>
  <text class="sub" x="532" y="168" text-anchor="middle">/tf, /tf_static</text>

  <rect class="node" x="400" y="200" width="125" height="44"/>
  <text class="lbl" x="462" y="219" text-anchor="middle">RViz, Nav2</text>
  <text class="sub" x="462" y="236" text-anchor="middle">node của bạn</text>
  <line class="arr" x1="462" y1="176" x2="462" y2="198"/>

  <rect class="node" x="540" y="200" width="125" height="44"/>
  <text class="lbl" x="602" y="219" text-anchor="middle">robot_state_</text>
  <text class="lbl" x="602" y="235" text-anchor="middle">publisher</text>
  <line class="arr" x1="602" y1="198" x2="602" y2="178"/>

  <rect class="node" x="335" y="255" width="120" height="48" fill="#fff5f5" stroke="#c53030"/>
  <text class="lbl" x="395" y="275" text-anchor="middle">ros_gz_bridge</text>
  <text class="sub" x="395" y="292" text-anchor="middle">gz_bridge.yaml</text>
  <line class="arr" x1="290" y1="222" x2="360" y2="253"/>
  <line class="arr" x1="430" y1="253" x2="480" y2="180"/>

  <text class="cap" x="350" y="338" text-anchor="middle">Gazebo KHÔNG nói được DDS. Topic nào cần thấy từ ROS 2 thì phải khai trong gz_bridge.yaml.</text>
  <text class="cap" x="350" y="358" text-anchor="middle">Ngoại lệ: gz_ros2_control nằm TRONG tiến trình Gazebo nhưng nói DDS thẳng -- nên /cmd_vel, /odom không cần bridge.</text>
</svg>
