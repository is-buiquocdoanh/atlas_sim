<svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .row { fill: #eef4fb; stroke: #2b6cb0; stroke-width: 1.8; rx: 6; }
    .lbl { font-size: 12.5px; fill: #1a202c; font-weight: 600; }
    .cap { font-size: 11px; fill: #718096; }
    .need { font-size: 11px; fill: #b7791f; font-weight: 600; }
  </style>

  <text x="280" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">4 display cần bật trong RViz khi lái tay</text>

  <rect class="row" x="20" y="38" width="520" height="44"/>
  <text class="lbl" x="35" y="56">RobotModel</text>
  <text class="cap" x="35" y="72">hình dạng robot, đọc trực tiếp từ /robot_description</text>
  <text class="need" x="545" y="64" text-anchor="end">cần: topic /robot_description</text>

  <rect class="row" x="20" y="86" width="520" height="44"/>
  <text class="lbl" x="35" y="104">TF</text>
  <text class="cap" x="35" y="120">trục tọa độ từng frame, cây quan hệ cha-con (Module 2)</text>
  <text class="need" x="545" y="112" text-anchor="end">cần: /tf, /tf_static</text>

  <rect class="row" x="20" y="134" width="520" height="44"/>
  <text class="lbl" x="35" y="152">LaserScan</text>
  <text class="cap" x="35" y="168">chấm đỏ tại mỗi điểm LiDAR quét được (Module 6)</text>
  <text class="need" x="545" y="160" text-anchor="end">cần: topic /scan</text>

  <rect class="row" x="20" y="182" width="520" height="44"/>
  <text class="lbl" x="35" y="200">Odometry</text>
  <text class="cap" x="35" y="216">mũi tên + vệt đường đi ước lượng từ bánh xe (Module 5)</text>
  <text class="need" x="545" y="208" text-anchor="end">cần: topic /odom</text>

  <text class="cap" x="280" y="245" text-anchor="middle">Fixed Frame nên đặt "odom" -- "map" chưa tồn tại nếu chưa chạy SLAM/AMCL (Module 8-9)</text>
</svg>
