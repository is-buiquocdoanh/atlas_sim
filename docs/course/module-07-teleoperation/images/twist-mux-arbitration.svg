<svg viewBox="0 0 580 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <style>
    .src { fill: #eef4fb; stroke: #2b6cb0; stroke-width: 1.8; rx: 8; }
    .mux { fill: #fef6e7; stroke: #b7791f; stroke-width: 2.5; rx: 10; }
    .out { fill: #eafaf1; stroke: #1a7a4c; stroke-width: 2; rx: 8; }
    .lbl { font-size: 12.5px; fill: #1a202c; font-weight: 600; }
    .cap { font-size: 10.5px; fill: #718096; }
    .arr { stroke: #a0aec0; stroke-width: 1.8; marker-end: url(#a); }
    .win { stroke: #1a7a4c; stroke-width: 2.4; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#a0aec0"/>
    </marker>
  </defs>

  <text x="290" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">twist_mux: ai được quyền ghi /cmd_vel lúc này?</text>

  <rect class="src" x="20" y="45" width="190" height="34"/>
  <text class="lbl" x="115" y="67" text-anchor="middle">cmd_vel_mag -- priority 10</text>

  <rect class="src" x="20" y="90" width="190" height="34"/>
  <text class="lbl" x="115" y="112" text-anchor="middle">cmd_vel_nav -- priority 50</text>

  <rect class="src win" x="20" y="135" width="190" height="34" fill="#eafaf1"/>
  <text class="lbl" x="115" y="157" text-anchor="middle">cmd_vel_joy -- priority 100</text>

  <rect class="src" x="20" y="180" width="190" height="34"/>
  <text class="lbl" x="115" y="202" text-anchor="middle">cmd_vel_collision -- priority 255*</text>

  <line class="arr" x1="210" y1="62" x2="248" y2="130"/>
  <line class="arr" x1="210" y1="107" x2="248" y2="140"/>
  <line class="arr win" x1="210" y1="152" x2="248" y2="152" marker-end="url(#a)"/>
  <line class="arr" x1="210" y1="197" x2="248" y2="160"/>

  <rect class="mux" x="250" y="110" width="110" height="80"/>
  <text class="lbl" x="305" y="145" text-anchor="middle">twist_mux</text>
  <text class="cap" x="305" y="162" text-anchor="middle">chọn priority</text>
  <text class="cap" x="305" y="175" text-anchor="middle">cao nhất, CHƯA timeout</text>

  <line class="arr win" x1="360" y1="150" x2="418" y2="150"/>
  <rect class="out" x="420" y="130" width="140" height="40"/>
  <text class="lbl" x="490" y="154" text-anchor="middle">/cmd_vel</text>

  <text class="cap" x="290" y="230" text-anchor="middle">* priority trong file ghi 1000, twist_mux tự kẹp về 255 -- thứ tự tương đối vẫn đúng</text>
  <text class="cap" x="290" y="250" text-anchor="middle">Lúc này: joystick (100) đang hoạt động, nav/mag thấp hơn -- joystick thắng</text>
  <text class="cap" x="290" y="270" text-anchor="middle">Nguồn nào quá timeout (0.5s không publish gì) bị coi như KHÔNG tồn tại, dù priority cao hơn</text>
</svg>
