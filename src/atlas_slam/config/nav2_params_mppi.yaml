# Nav2 cho Atlas (Module 9 - AMCL, Module 10 - costmap/planner/controller).
# Footprint 0.30 x 0.24m (khớp atlas_description/urdf/atlas.urdf.xacro), giới hạn vận tốc
# đặt DƯỚI mức cứng của diff_drive_controller (max linear 0.5, max angular 1.5) để còn dư
# biên độ an toàn khi Nav2 điều khiển.
#
# Controller: MPPI (Model Predictive Path Integral) -- lấy mẫu hàng ngàn quỹ đạo ngẫu nhiên, né vật cản chủ động nhất, tốn CPU nhất.
# Đổi thuật toán = đổi file này (launch arg controller:=dwb|rpp|mppi trong
# atlas_slam/launch/navigation.launch.py), không phải đổi qua API lúc runtime.
# 3 file config_dwb/rpp/mppi.yaml giống hệt nhau ở mọi phần khác, chỉ khác đúng
# khối FollowPath bên dưới -- để đảm bảo amcl/costmap/planner/bt cùng 1 cấu hình
# khi so sánh, chỉ biến số là thuật toán controller.
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    laser_max_range: 10.0
    laser_min_range: 0.12
    max_particles: 2000
    min_particles: 500
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
