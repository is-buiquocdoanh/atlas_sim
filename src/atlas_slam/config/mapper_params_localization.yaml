# slam_toolbox ở CHẾ ĐỘ LOCALIZATION (khác hẳn mapper_params.yaml dùng để vẽ map - Module 8):
# không tạo map mới, chỉ định vị robot trên map ĐÃ CÓ bằng scan matching liên tục -- vai trò
# tương đương AMCL (đều publish map->odom), nhưng dùng thuật toán khác (Karto scan matching +
# pose graph, không phải particle filter). Chọn qua atlas_slam/launch/navigation.launch.py
# bằng launch arg localization:=slam_toolbox (mặc định vẫn là amcl).
#
# QUAN TRỌNG: map_file_name phải trỏ tới file đã SERIALIZE bằng chính slam_toolbox (.posegraph
# + .data), KHÔNG PHẢI file .pgm/.yaml thường của nav2_map_server/AMCL -- 2 định dạng khác
# nhau hoàn toàn. Nếu chỉ có map .pgm/.yaml từ Module 8 (map_saver_cli) mà chưa serialize,
# phải serialize trước (xem hướng dẫn trong atlas_slam/launch/slam.launch.py).
# map_file_name được atlas_slam/launch/navigation.launch.py tự điền lúc chạy (RewrittenYaml),
# không cần sửa tay file này.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: localization

    # Cả 2 dòng dưới được navigation.launch.py tự điền bằng RewrittenYaml lúc chạy (đọc từ
    # launch arg map:= và initial_pose_x/y/yaw:=) -- giá trị ở đây chỉ là placeholder.
    # map_start_pose BẮT BUỘC phải có giá trị với slam_toolbox mode=localization, khác AMCL
    # (không cần set, chỉ cần đặt "2D Pose Estimate" trong RViz sau khi đã chạy) -- thiếu
    # tham số này slam_toolbox báo lỗi "Map starting pose not specified" và quét map mới
    # toanh thay vì định vị trên map đã nạp, dù map_file_name đúng.
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    # map_update_interval RẤT LỚN = /map gần như không bao giờ được vẽ lại sau lần publish
    # đầu tiên -- đây là tham số chặn "map bị mở rộng" mà bạn thấy. mapper_params.yaml
    # (Module 8, mode=mapping) để 2.0 vì CẦN cập nhật liên tục khi đang vẽ map; ở đây
    # (mode=localization) map đã có sẵn, không cần vẽ lại, chỉ cần scan matching để định vị.
    map_update_interval: 99999999.0
    restamp_tf: false
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 9.5
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    # false ở mode=localization: loop closure để sửa SAI SỐ TÍCH LŨY khi đang vẽ map dài
    # (Module 8), không cần thiết khi map đã có sẵn -- bật lên còn có nguy cơ tự "sửa" lại
    # cấu trúc map đã nạp (thêm 1 lý do map có thể đổi/mở rộng ngoài ý muốn).
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
