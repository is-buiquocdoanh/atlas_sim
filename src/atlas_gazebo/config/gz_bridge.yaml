# Cấu hình ros_gz_bridge: ánh xạ topic giữa Gazebo Transport <-> ROS 2.
# /cmd_vel và /odom (Module 5) KHÔNG bridge ở đây -- gz_ros2_control publish/subscribe
# thẳng bằng rclcpp bên trong tiến trình Gazebo (xem atlas_control/urdf/atlas.control.xacro),
# không đi qua Gazebo Transport nên không cần dòng bridge. Chỉ /clock và dữ liệu cảm biến
# (sensor Gazebo -> Gazebo Transport -> ROS 2) mới thực sự cần bridge.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
